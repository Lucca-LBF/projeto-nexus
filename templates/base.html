{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fonte Futurista -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS EMBUTIDO (Garante que vai funcionar 100% agora) -->
    <style>
        :root {
            --nexus-bg-1: #0B0C10;
            --nexus-bg-2: #09121c;
            --nexus-bg-3: #0c1826;
            --nexus-surface: #1F2833;
            --nexus-primary: #45A29E;
            --nexus-secondary: #66FCF1;
            --nexus-accent: #7b2cbf;
            --nexus-text: #C5C6C7;
            --nexus-title: #FFFFFF;
            --nexus-border: rgba(102, 252, 241, 0.2);
        }

        body {
            background: linear-gradient(135deg, var(--nexus-bg-1), var(--nexus-bg-2), var(--nexus-bg-3), var(--nexus-bg-2)) !important;
            background-size: 400% 400% !important;
            animation: gradientBG 15s ease infinite !important;
            color: var(--nexus-text) !important;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1, h2, h3, h4, h5, h6, .navbar-brand {
            color: var(--nexus-title) !important;
        }

        .navbar {
            background-color: rgba(31, 40, 51, 0.95) !important;
            backdrop-filter: blur(5px);
            border-bottom: 2px solid var(--nexus-secondary);
            box-shadow: 0 4px 20px rgba(102, 252, 241, 0.15);
            margin-bottom: 2.5rem !important;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nexus-highlight {
            color: var(--nexus-secondary);
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
        }

        .card {
            background-color: var(--nexus-surface) !important;
            border: 1px solid var(--nexus-border) !important;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            background-color: rgba(0,0,0,0.3) !important;
            border-bottom: 1px solid var(--nexus-border) !important;
        }

        .form-label {
            color: var(--nexus-primary);
        }

        .form-control {
            background-color: rgba(11, 12, 16, 0.7) !important;
            border: 1px solid var(--nexus-border) !important;
            color: var(--nexus-text) !important;
        }

        .form-control:focus {
            border-color: var(--nexus-secondary) !important;
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.4) !important;
        }

        .btn-primary {
            background-color: var(--nexus-primary) !important;
            border-color: var(--nexus-primary) !important;
            color: #000 !important;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--nexus-secondary) !important;
            border-color: var(--nexus-secondary) !important;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.6);
        }

        .text-info { color: var(--nexus-secondary) !important; }
        .text-success { color: var(--nexus-accent) !important; }
    </style>
    
    <title>NEXUS - Simulador IoT</title>
</head>
<body class="bg-dark text-light">

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand" href="#" style="font-family: 'Orbitron', sans-serif; font-size: 1.5rem;">
                <span class="nexus-highlight">NEXUS</span> | Simulador IoT
            </a>
        </div>
    </nav>

    <!-- O Conteúdo da Página -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Scripts do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
