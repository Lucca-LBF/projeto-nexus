{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.classList.add('js');</script>
    <!-- Fonte (a mesma família usada no site da Bzu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}?v=bzu2" rel="stylesheet">
    
    <title>NEXUS - Simulador IoT</title>
</head>
<body>

    {% block header %}
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
        <div class="container">
    
            <a class="navbar-brand" href="{% url 'home' %}">
                <span class="nexus-highlight">NEXUS</span><span class="brand-sep">|</span>Simulador IoT
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuNexus" aria-controls="menuNexus" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            
    
            <div class="collapse navbar-collapse" id="menuNexus">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'formulario_simulador' %}">Simulador</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-cta" href="{% url 'contato' %}">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {% endblock %}

    {% block hero %}{% endblock %}

    <div class="container page flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="site-footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
            <span><strong>NEXUS</strong> &middot; Simulador de ROI em IoT</span>
            <span>Os resultados são estimativas feitas com premissas de referência.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // faz os blocos com a classe "reveal" aparecerem suavemente ao rolar a página
        (function () {
            var itens = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window)) {
                itens.forEach(function (el) { el.classList.add('in'); });
                return;
            }
            var obs = new IntersectionObserver(function (entradas) {
                entradas.forEach(function (e) {
                    if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }
                });
            }, { threshold: 0.12 });
            itens.forEach(function (el) { obs.observe(el); });
        })();
    </script>
</body>
</html>
