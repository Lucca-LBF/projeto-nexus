{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fonte Futurista -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    
    <title>NEXUS - Simulador IoT</title>
</head>
<body class="bg-dark text-light">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
    
            <a class="navbar-brand" href="{% url 'home' %}" style="font-family: 'Orbitron', sans-serif; font-size: 1.5rem;">
                <span class="nexus-highlight">NEXUS</span> | Simulador IoT
            </a>
            
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#menuNexus">
                <span class="navbar-toggler-icon"></span>
            </button>
            
    
            <div class="collapse navbar-collapse" id="menuNexus">
                <ul class="navbar-nav ms-auto fw-bold">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'resultado_simulacao' %}">Simulador</a>
                    </li>
                    <li class="nav-item">
                       
                        <a class="nav-link text-info" href="{% url 'contato' %}">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

 
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
